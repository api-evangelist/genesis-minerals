aid: genesis-minerals

name: Genesis Minerals

description: Genesis Minerals Limited is an ASX-listed gold producer ("gold house") 100% focused on the Leonora and Laverton
  districts of Western Australia, operating the Gwalia, Ulysses, Admiral, Tower Hill, Harbour Lights, Laverton, Jupiter, Redcliffe
  and Bardoc assets, plus an in-house Genesis Mining Services business. Its website publishes investor announcements, reports,
  presentations and sustainability information; it does not publish a public developer API or API documentation.

